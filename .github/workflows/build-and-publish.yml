name: Build and Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      fyy_version:
        description: 'fyy CLI version (e.g. v1.0.0)'
        required: false
        default: 'latest'
        type: string
      image_tag:
        description: 'Custom image tag suffix'
        required: false
        type: string
      trivy_severity:
        description: 'Trivy severity levels'
        required: false
        default: 'CRITICAL,HIGH'
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

env:
  IMAGE_NS: feiyueyun/fyy-sandbox
  FYY_VERSION: ${{ inputs.fyy_version || 'latest' }}
  TRIVY_SEVERITY: ${{ inputs.trivy_severity || 'CRITICAL,HIGH' }}

jobs:
  # =========================================================================
  # Build & Test
  # =========================================================================
  build-base:
    name: Build Base Image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build base image (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: base/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NS }}:latest
          build-args: |
            FYY_VERSION=${{ env.FYY_VERSION }}
            BUILD_MODE=release
            BUILD_DATE=${{ github.event.head_commit.timestamp || '' }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run smoke tests (base)
        run: bash scripts/smoke-test.sh --image ${{ env.IMAGE_NS }}:latest --type base

  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: build-base
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build base image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: base/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NS }}:latest
          build-args: |
            FYY_VERSION=${{ env.FYY_VERSION }}
            BUILD_MODE=release
          cache-from: type=gha

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: '${{ env.IMAGE_NS }}:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: '${{ env.TRIVY_SEVERITY }}'
          exit-code: '0'
          vuln-type: 'os,library'
          ignorefile: '.trivyignore'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy scan (table output)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: '${{ env.IMAGE_NS }}:latest'
          format: 'table'
          severity: '${{ env.TRIVY_SEVERITY }}'
          exit-code: '0'
          vuln-type: 'os,library'
          ignorefile: '.trivyignore'

  # =========================================================================
  # Push to Docker Hub
  # =========================================================================
  push-base:
    name: Push Base Image
    runs-on: ubuntu-latest
    needs: [build-base, trivy-scan]
    if: github.event_name != 'pull_request'
    outputs:
        digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NS }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push base image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: base/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FYY_VERSION=${{ env.FYY_VERSION }}
            BUILD_MODE=release
            BUILD_DATE=${{ github.event.head_commit.timestamp || '' }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Pushed ${{ env.IMAGE_NS }} digest=${{ steps.push.outputs.digest }}"

  # =========================================================================
  # Build & Push Templates
  # =========================================================================
  build-templates:
    name: Build Template (${{ matrix.template }})
    runs-on: ubuntu-latest
    needs: push-base
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        template: [crewai, langgraph]
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NS }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ matrix.template }},enable={{is_default_branch}}
            type=semver,pattern=${{ matrix.template }}-{{version}}
            type=semver,pattern=${{ matrix.template }}-v{{major}}.{{minor}}

      - name: Build and push template image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: templates/${{ matrix.template }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run smoke tests
        run: |
          docker buildx build \
            --load \
            -t ${{ env.IMAGE_NS }}:${{ matrix.template }} \
            -f templates/${{ matrix.template }}/Dockerfile \
            .
          bash scripts/smoke-test.sh \
            --image ${{ env.IMAGE_NS }}:${{ matrix.template }} \
            --type ${{ matrix.template }}

  # =========================================================================
  # Cosign Signing (v1.0 enhancement)
  # =========================================================================
  cosign-sign:
    name: Sign Images
    runs-on: ubuntu-latest
    needs: [push-base, build-templates]
    if: startsWith(github.ref, 'refs/tags/v')
    continue-on-error: true
    steps:
      - uses: sigstore/cosign-installer@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sign base image
        run: cosign sign --yes ${{ env.IMAGE_NS }}@${{ needs.push-base.outputs.digest }}
        continue-on-error: true

      - name: Sign template images
        run: |
          for tag in crewai langgraph; do
            cosign sign --yes "${{ env.IMAGE_NS }}:${tag}" || echo "WARNING: Failed to sign $tag"
          done
        continue-on-error: true
